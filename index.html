<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <div class="logo">TravelBloom</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Enter a destination or keyword">

        <button id="resetBtn">Clear</button>

    </nav>

      <h1>
        EXPLORE <br>
        DREAM <br>
        DESTINATION

        It encourages exploration of unfamiliar territories, embracing diverse cultures and landscapes, 
        while pursuing the desired destination that captivates the heart and ignites a sense of wonder.
      </p>
      <a href="#results" class="btn">BOOK NOW</a>
    </div>
  </section>

  <!-- Results Section -->
  <section id="results" class="results"></section>

  <script src="js/index.js"></script>

</html>
