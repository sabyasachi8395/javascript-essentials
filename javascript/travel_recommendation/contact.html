<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TravelBloom</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">TravelBloom</div>
      <ul class="nav-links">
        <li><a href="travel_recommendation.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Enter a destination or keyword">
        <button id="searchBtn">Search</button>
        <button id="resetBtn">Clear</button>
      </div>
    </nav>
  </header>

  <section class="hero contact-hero">
    <div class="hero-text">
      <h1>Contact Us</h1>
      <p>We’d love to hear from you! Get in touch with us for inquiries, feedback, or support.</p>
    </div>
  </section>

  <section class="content">
    <h2>Get in Touch</h2>
    <form class="contact-form">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </section>

  <footer>
    <p>© 2025 TravelBloom. All rights reserved.</p>
  </footer>
</body>
</html>
